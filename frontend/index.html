<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>radiod monitor</title>
    <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="/static/style.css?v=3">
</head>

<body>
    <div id="app-container">
        <aside id="sidebar">
            <header class="header">
                <h1>radiod monitor</h1>
                <p>Live SDR monitoring via ka9q-radio</p>
                <div class="status-indicator">
                    <span id="ws-status" class="status-dot disconnected"></span>
                    <span id="ws-text">Disconnected</span>
                </div>
            </header>

            <section class="controls">
                <!-- Radiod instance selector -->
                <div class="control-group">
                    <label for="hostSelect">Radiod Instance</label>
                    <div class="input-with-button">
                        <select id="hostSelect" style="flex:1;">
                            <option value="">Discovering…</option>
                        </select>
                        <button id="hostRefreshBtn" title="Rescan mDNS for radiod instances"
                            style="padding: 0.5rem 0.75rem;">↻</button>
                    </div>
                </div>

                <!-- Mode (source) selector -->
                <div class="control-group">
                    <label for="modeSelect">Mode</label>
                    <select id="modeSelect">
                        <option value="">Loading…</option>
                    </select>
                </div>

                <!-- Per-mode controls get injected here -->
                <div id="modeControls"></div>

                <!-- Location -->
                <div class="control-group">
                    <label for="locationInput">Maidenhead Grid or Lat,Lon</label>
                    <div class="input-with-button">
                        <input type="text" id="locationInput" placeholder="e.g. EM38ww" value="EM38ww">
                        <button id="searchBtn">SCAN</button>
                    </div>
                </div>

                <!-- Squelch -->
                <div class="control-group slider-container">
                    <label for="squelchSlider">Squelch (SNR dB):
                        <span id="squelchValue">10</span> dB</label>
                    <input type="range" id="squelchSlider" min="-20" max="40" step="0.5" value="10">
                </div>

                <!-- Radius -->
                <div class="control-group slider-container">
                    <label for="radiusSlider">Search Radius:
                        <span id="radiusValue">100</span> km</label>
                    <input type="range" id="radiusSlider" min="10" max="1000" step="10" value="100">
                </div>
            </section>

            <!-- Active audio panel -->
            <section id="audio-panel" class="hidden">
                <div class="audio-info">
                    <h3>Streaming Audio</h3>
                    <p id="audio-repeater-callsign">—</p>
                    <p id="audio-repeater-freq">—</p>
                    <div class="waveform-anim">
                        <div class="bar"></div>
                        <div class="bar"></div>
                        <div class="bar"></div>
                    </div>
                </div>
                <button id="resumeAudioBtn" class="hidden"
                    style="margin-top: 1rem; width: 100%; background: var(--active);">
                    UNMUTE / RESUME AUDIO
                </button>
                <button id="stopAudioBtn" class="danger">Stop Listening</button>
            </section>

            <section id="repeater-list-container">
                <h3>Discovered Stations (<span id="repeaterCount">0</span>)</h3>
                <ul id="repeaterList"></ul>
            </section>
        </aside>

        <main id="map-container">
            <div id="map"></div>
            <div id="freq-strip" class="freq-strip" aria-label="Frequency view">
                <canvas id="freq-strip-canvas" height="64"></canvas>
                <div id="freq-strip-hover" class="freq-strip-hover hidden"></div>
                <div id="freq-strip-caption" class="freq-strip-caption"></div>
            </div>
        </main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="/static/app.js?v=5"></script>
</body>

</html>
