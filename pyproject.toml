[project]
name = "radiod-monitor"
version = "0.1.0"
description = "Unified web frontend for monitoring and streaming from ka9q-radio's radiod, with pluggable frequency sources."
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "websockets",
    "maidenhead",
    "pydantic>=2.0",
    # 3.25.0 is the first release with RadiodStream(raw_payloads=True),
    # which the audio plane requires to receive Opus frames at all; earlier
    # versions drop OPUS payloads silently. 3.25.1 fixes DEMOD_TYPE being
    # sent in contradiction to the preset, which ran the narrowband FM
    # demodulator behind the wfm preset and made broadcast FM produce no
    # audio at all. Neither failure reports an error, so do not lower this.
    "ka9q-python>=3.25.1",
]

[project.optional-dependencies]
# tests/test_audio_ws.py drives /ws/audio through FastAPI's TestClient, which
# starlette implements on top of httpx. Nothing in the running app needs it.
test = ["pytest", "httpx"]

[tool.setuptools]
packages = ["backend", "backend.sources"]
