[project]
name = "radiod-monitor"
version = "0.1.0"
description = "Unified web frontend for monitoring and streaming from ka9q-radio's radiod, with pluggable frequency sources."
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "websockets",
    "maidenhead",
    "pydantic>=2.0",
    # Floor is 3.25.0, not 3.24.0: 3.25.0 is the first release with
    # RadiodStream(raw_payloads=True), which the audio plane requires to
    # receive Opus frames at all. Earlier versions drop OPUS payloads
    # silently — the stream stays healthy and delivers nothing.
    "ka9q-python>=3.25.0",
]

[tool.setuptools]
packages = ["backend", "backend.sources"]
